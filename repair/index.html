<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#efe8dc"><meta name="description" content="小小修理铺。把不亮的灯、停下的八音盒和散开的星星，慢慢修好。"><title>小小修理铺 · 一小块空地</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23efe8dc'/%3E%3Cpath d='M23 5a8 8 0 0 0-10 11l-8 8 4 4 8-8A8 8 0 0 0 28 10l-6 6-6-6Z' fill='%23ab7951'/%3E%3C/svg%3E"></head>
<body>
  <header><a href="/">← 回到空地</a><nav aria-label="其他地方"><a href="/home/">去小家坐坐 ↗</a><button id="sound" type="button" aria-pressed="false">声音：关</button></nav></header>
  <main>
    <section class="heading"><div><p class="eyebrow">LITTLE THINGS, SECOND CHANCES</p><h1>小小修理铺。</h1></div><p>有些东西还可以再用。<br>给它一点时间，也给自己一点。</p></section>
    <div class="shop">
      <aside class="shelf"><p class="eyebrow">今天桌上有什么</p><nav id="jobs" aria-label="选择要修的物品">
        <button type="button" data-job="lamp" aria-pressed="true"><svg viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="68" rx="24" ry="4" fill="#d7cab4"/><path d="M40 32v31m-15 4h30" stroke="#846950" stroke-width="5" stroke-linecap="round"/><path d="M29 17h22l13 24H16Z" fill="#c1a16f" stroke="#91764f" stroke-width="1.5"/><path d="m42 18-4 10 5 5-5 8" stroke="#f5e8cc" stroke-width="2" fill="none"/></svg><span><strong>不亮的小灯</strong><small>把一点光找回来</small></span><i class="done" hidden>✓</i></button>
        <button type="button" data-job="music"><svg viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="68" rx="28" ry="4" fill="#d7cab4"/><path d="m13 37 26-12 29 12-28 14Z" fill="#d7b98a"/><path d="M13 37v21l27 12V51Z" fill="#ae7e52"/><path d="M40 51v19l28-12V37Z" fill="#bc9567"/><circle cx="41" cy="39" r="8" fill="#866c4c"/><circle cx="41" cy="39" r="3" fill="#dbc08c"/><path d="M67 49h8v10" fill="none" stroke="#826744" stroke-width="3" stroke-linecap="round"/></svg><span><strong>停下的八音盒</strong><small>让旋律接着走</small></span><i class="done" hidden>✓</i></button>
        <button type="button" data-job="star"><svg viewBox="0 0 80 80" aria-hidden="true"><ellipse cx="40" cy="68" rx="24" ry="4" fill="#d7cab4"/><path d="m40 10 8 18 21 3-15 15 4 22-18-10-18 10 4-22-15-15 21-3Z" fill="#d6b771" stroke="#a48649" stroke-width="1.5"/><path d="m40 10-1 29 15 7M11 31l28 8-17 29m17-29 19 29" stroke="#f3e7c6" stroke-width="2" fill="none"/></svg><span><strong>散开的星星</strong><small>把夜晚拼完整</small></span><i class="done" hidden>✓</i></button>
      </nav><p class="shelf-note">不用赶工。<br>修好了，它就多一个明天。</p></aside>
      <section class="work-area" aria-labelledby="job-title"><div class="work-heading"><span id="job-number">01 / 03</span><h2 id="job-title">不亮的小灯</h2><span id="progress">0 / 4</span></div>
        <div id="workbench" class="workbench"></div>
        <div class="instructions"><p id="instruction" aria-live="polite"></p><p id="feedback" class="feedback" role="status" aria-live="polite">先看看它哪里松了。</p></div>
        <div class="work-actions"><button id="try" class="primary" type="button" disabled>试着开灯</button><button id="again" type="button">重新修这件</button></div>
      </section>
    </div>
    <section class="collection"><div><p class="eyebrow">修好的小东西</p><p id="collection-note">架子还空着，慢慢来。</p></div><div id="repaired" class="repaired"></div></section>
  </main>
  <footer><span>把小小的东西，认真修好。</span><a href="/home/">收工了，回小家 ↗</a></footer>
  <noscript><p>启用 JavaScript，就可以动手修理这些小东西。</p></noscript><script src="shop.js" defer></script>
</body></html>
