name: Village browser verification
on:
  push:
    branches: [feature/village-music-box]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check routes, audio controls and saved progress
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/qa" playwright@1.55.0 --no-audit --no-fund
          export NODE_PATH="$RUNNER_TEMP/qa/node_modules"
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/village-http.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break || sleep 1; done
          node --test tests/models.test.cjs
          mkdir -p "$RUNNER_TEMP/screens"
          SCREENSHOT_DIR="$RUNNER_TEMP/screens" node tests/places.cjs
          node tests/browser.cjs
          if command -v convert >/dev/null; then
            convert "$RUNNER_TEMP/screens/mechanism.png" -resize 650x290 -quality 67 /tmp/village-mechanism.jpg
            echo "Render-JPEG $(base64 -w 0 /tmp/village-mechanism.jpg)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanism-render
          path: ${{ runner.temp }}/screens/
          retention-days: 1
